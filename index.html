<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventFinder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <h2 class="logo">EventFinder</h2>
  <ul>
    <li><button id="homeBtn">Home</button></li>
    <li><button id="eventsBtn">Events</button></li>
    <li><button id="contactBtn">Contact</button></li>
    <li><button id="toggleMode">🌙</button></li>
  </ul>
</nav>
<!-- Hero Section -->
<section id="heroSection" class="hero">
  <h1>Discover Events Near You</h1>
  <p>Find exciting events happening around you</p>
  <input type="text" id="search" placeholder="🔍 Search events...">
</section>

<!-- Events Section -->
<section id="eventsSection" class="events">
  <h2>Featured Events</h2>
  <div id="eventContainer" class="grid"></div>
</section>

<!-- Contact Sidebar -->
<div id="contactSidebar" class="sidebar">
  <button id="closeSidebar">✖</button>
  <h2>Contact Me</h2>
  <p><strong>Name:</strong> Khaleeq Ur Rehman</p>
  <p><strong>Phone:</strong> 03353342739</p>
  <p><strong>Email:</strong> <a href="mailto:khaleequrrehman.ms@gmail.com">khaleequrrehman.ms@gmail.com</a></p>
</div>

<script src="script.js"></script>
</body>
</html>
